plugins {
    id "com.android.application"
    id "kotlin-android"
    // Plugin Flutter harus diterapkan setelah plugin Android dan Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

// Kredensial penandatanganan dibaca dari android/key.properties, yang sengaja
// tidak ikut ter-commit. Tanpa berkas itu build rilis tetap jalan memakai kunci
// debug, disertai peringatan -- Play Store menolak APK bertanda tangan debug,
// jadi kekeliruan itu ketahuan sebelum sempat dirilis.
def berkasKunci = rootProject.file("key.properties")
def kunci = new Properties()
if (berkasKunci.exists()) {
    berkasKunci.withInputStream { kunci.load(it) }
}

android {
    namespace = "com.example.catatan_amalan"
    // flutter_local_notifications 22 mensyaratkan compileSdk 36.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Diperlukan agar penjadwalan notifikasi tetap jalan di Android lama.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.example.catatan_amalan"
        // Batas minimum flutter_local_notifications 22.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (berkasKunci.exists()) {
                storeFile = file(kunci["storeFile"])
                storePassword = kunci["storePassword"]
                keyAlias = kunci["keyAlias"]
                keyPassword = kunci["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (berkasKunci.exists()) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn("PERINGATAN: android/key.properties tidak ditemukan; "
                    + "build rilis ditandatangani kunci debug dan akan ditolak Play Store.")
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
